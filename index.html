<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7385; --line:#e3e6ec; --accent:#1f5fbf; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:16px 20px; font-weight:600; font-size:18px; }
  main { max-width:720px; margin:0 auto; padding:20px; }
  .search { width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
  .count { color:var(--muted); font-size:13px; margin:0 0 10px; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:12px 14px; border-top:1px solid var(--line); text-decoration:none; color:inherit; }
  .row:first-child { border-top:none; }
  .row:hover { background:#f0f5ff; }
  .row .n { font-weight:600; }
  .row .sub { color:var(--muted); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; }
  .avatar { width:72px; height:72px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:600; margin-bottom:14px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .ar { font-size:20px; color:var(--muted); direction:rtl; margin:0 0 18px; text-align:right; }
  dl { display:grid; grid-template-columns: 140px 1fr; gap:10px 14px; margin:0; }
  dt { color:var(--muted); font-size:14px; }
  dd { margin:0; font-size:15px; word-break:break-word; }
  .badge { display:inline-block; padding:3px 10px; border-radius:999px; background:#e6f4ea; color:#1e7a3a; font-size:13px; }
  .back { display:inline-block; margin-bottom:14px; color:var(--accent); text-decoration:none; font-size:14px; }
  .empty { color:var(--muted); padding:20px; text-align:center; }
</style>

const app = document.getElementById('app');
const byId = Object.fromEntries(EMPLOYEES.map(e => [e.id, e]));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initials(name) {
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function renderList(filter = '') {
  const q = filter.trim().toLowerCase();
  const items = EMPLOYEES.filter(e =>
    !q || [e.name, e.nameAr, e.sap, e.finger, e.id].some(v => String(v).toLowerCase().includes(q)));
  const rows = items.map(e => `
    <a class="row" href="#/e/${encodeURIComponent(e.id)}">
      <div><div class="n">${esc(e.name)}</div><div class="sub">${esc(e.company)}</div></div>
      <div class="sub" style="text-align:right">SAP ${esc(e.sap || '—')}<br>Finger ${esc(e.finger)}</div>
    </a>`).join('');
  app.innerHTML = `
    <input class="search" id="q" type="search" placeholder="Search by name, SAP or finger number" value="${esc(filter)}">
    <p class="count">${items.length} of ${EMPLOYEES.length} employees</p>
    <div class="list">${rows || '<div class="empty">No matching employees</div>'}</div>`;
  const input = document.getElementById('q');
  input.addEventListener('input', () => {
    renderList(input.value);
    const again = document.getElementById('q');
    again.focus();
    again.setSelectionRange(again.value.length, again.value.length);
  });
}

function renderProfile(id) {
  const e = byId[id];
  if (!e) {
    app.innerHTML = `<a class="back" href="#/">&larr; All employees</a><div class="card"><div class="empty">Employee not found.</div></div>`;
    return;
  }
  app.innerHTML = `
    <a class="back" href="#/">&larr; All employees</a>
    <div class="card">
      <div class="avatar">${esc(initials(e.name))}</div>
      <h1>${esc(e.name)}</h1>
      <p class="ar">${esc(e.nameAr)}</p>
      <dl>
        <dt>Company</dt><dd>${esc(e.company)}</dd>
        <dt>SAP number</dt><dd>${esc(e.sap || '—')}</dd>
        <dt>Finger number</dt><dd>${esc(e.finger)}</dd>
        <dt>Start date</dt><dd>${esc(e.start)}</dd>
        <dt>Status</dt><dd><span class="badge">${esc(e.status)}</span></dd>
      </dl>
    </div>`;
}

function route() {
  const m = location.hash.match(/^#\/e\/(.+)$/);
  if (m) renderProfile(decodeURIComponent(m[1]));
  else renderList();
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
route();
</script>
